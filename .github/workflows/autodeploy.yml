name: CI
on:
  push:
    branches: [main, clean-main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npm run validate:mdx
      - run: npm run lint
      - run: npm test
      - run: npm run build
