name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure native bindings (workaround npm optional dep bug)
        run: npm install @rolldown/binding-linux-x64-gnu --no-save --ignore-scripts || true
      - run: npm run validate:mdx
      - run: npm run format:check
      - run: npm run lint
      - name: i18n hardcoded strings check
        run: npm run check:i18n
      - run: npm test
      - run: npm run build
      - name: Validate worker syntax
        run: node -c .cloudflare/worker.js
      - uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: out/
          if-no-files-found: error
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fail-on-severity: high

  codeql:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure native bindings (workaround npm optional dep bug)
        run: npm install @rolldown/binding-linux-x64-gnu --no-save --ignore-scripts || true
      - name: Build static site
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
