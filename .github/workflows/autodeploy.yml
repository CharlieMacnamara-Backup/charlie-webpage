name: CI
on:
  push:
    branches: [main, clean-main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure native bindings (workaround npm optional dep bug)
        run: npm install @rolldown/binding-linux-x64-gnu --no-save --ignore-scripts || true
      - run: npm run validate:mdx
      - run: npm run lint
      - run: npm test
      - run: npm run build
