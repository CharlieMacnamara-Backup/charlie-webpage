name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure native bindings (workaround npm optional dep bug)
        run: npm install @rolldown/binding-linux-x64-gnu --no-save --ignore-scripts || true
      - run: npm run validate:mdx
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check wrangler config
        run: npx wrangler --experimental-json-config types 2>/dev/null || echo "wrangler types check skipped"
      - name: Validate worker syntax
        run: node -c .cloudflare/worker.js

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure native bindings (workaround npm optional dep bug)
        run: npm install @rolldown/binding-linux-x64-gnu --no-save --ignore-scripts || true
      - name: Build static site
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
