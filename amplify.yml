version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18
        - node -v
        - npm -v
        - npm ci --legacy-peer-deps
    build:
      commands:
        - NODE_OPTIONS="--max_old_space_size=4096" npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/* 